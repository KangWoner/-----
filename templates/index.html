<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쏘미 - 중학생 수학 학습 도우미</title>
    <style>
        /* 간단한 스타일 (나중에 style.css로 분리) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }

        .start-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .start-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .features {
            margin-top: 40px;
            text-align: left;
        }

        .feature {
            margin: 15px 0;
            font-size: 1.1em;
            color: #555;
        }

        .feature::before {
            content: "✨ ";
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 쏘미</h1>
        <p class="subtitle">소크라테스처럼 질문하며 함께 성장하는 AI 수학 튜터</p>

        <a href="/chat" class="start-btn">문제 풀이 시작하기</a>

        <div class="features">
            <div class="feature">답을 주지 않고 질문으로 가이드</div>
            <div class="feature">3단계 힌트 시스템</div>
            <div class="feature">틀려도 괜찮은 안전한 학습 공간</div>
            <div class="feature">중학생 맞춤형 친근한 대화</div>
        </div>
    </div>

    <script>
        // 간단한 환영 콘솔 메시지
        console.log('🎓 쏘미에 오신 것을 환영합니다!');
        console.log('📚 함께 수학을 정복해봐요!');
    </script>
</body>
</html>
